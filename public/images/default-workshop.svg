<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3f4f6" />
      <stop offset="100%" stop-color="#e5e7eb" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgGrad)" />
  <g transform="translate(250, 140)">
    <!-- Presentation board / workshop icon -->
    <rect x="-50" y="-40" width="100" height="70" rx="8" fill="url(#iconGrad)" />
    <!-- Screen content line -->
    <line x1="-30" y1="-20" x2="30" y2="-20" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="-30" y1="-5" x2="10" y2="-5" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="-30" y1="10" x2="-5" y2="10" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <!-- Stand -->
    <line x1="0" y1="30" x2="0" y2="55" stroke="#9ca3af" stroke-width="5" stroke-linecap="round" />
    <line x1="-25" y1="70" x2="0" y2="55" stroke="#9ca3af" stroke-width="5" stroke-linecap="round" />
    <line x1="25" y1="70" x2="0" y2="55" stroke="#9ca3af" stroke-width="5" stroke-linecap="round" />
  </g>
  <text x="300" y="270" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-size="18" font-weight="600">
    Taller / Workshop
  </text>
</svg>
